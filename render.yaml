# Render Blueprint for the VoteChain API. In Render: New → Blueprint → pick this repo.
# Every value marked `sync: false` is asked for once in the Render dashboard; never commit them.
services:
  - type: web
    name: votechain-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: TRUST_PROXY
        value: "2"
      - key: CHAIN_NETWORK
        value: sepolia
      - key: CHAIN_CONFIRMATIONS
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: VOTER_TOKEN_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: RPC_URL
        sync: false
      - key: PUBLIC_RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
