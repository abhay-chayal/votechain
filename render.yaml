# Render Blueprint: one web service that runs the API and serves the web app, so the whole
# product lives on one domain. In Render: New → Blueprint → pick this repository.
# Values marked `sync: false` are entered once in the Render dashboard. Never commit them.
services:
  - type: web
    name: votechain
    runtime: node
    plan: free
    buildCommand: npm --prefix client ci --include=dev && npm --prefix client run build && npm --prefix server ci --omit=dev
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: CHAIN_NETWORK
        value: sepolia
      - key: PUBLIC_RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: VITE_SHOW_DEMO_ACCOUNTS
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: VOTER_TOKEN_SECRET
        generateValue: true
      # Your site's address, e.g. https://votechain.onrender.com or https://yourdomain.in
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: RPC_URL
        sync: false
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
